<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>局域网剪贴板</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #6a737d;
    --accent: #0969da;
    --accent-text: #ffffff;
    --danger: #cf222e;
    --ok: #1a7f37;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --danger: #f85149;
      --ok: #3fb950;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 0 env(safe-area-inset-bottom);
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
  #status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .2s; }
  #dot.online { background: var(--ok); }
  #dot.offline { background: var(--danger); }

  main { max-width: 820px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }

  textarea {
    width: 100%; min-height: 220px; resize: vertical;
    padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* iOS Safari 在字号小于 16px 时一聚焦就把整页放大，回不去 */
  @media (pointer: coarse) { textarea { font-size: 16px; } }

  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    appearance: none; cursor: pointer;
    padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    font-size: 14px; font-weight: 500; font-family: inherit;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.ghost { background: transparent; color: var(--muted); }
  button.danger { color: var(--danger); }

  /* 别人刚改了、而你正在打字时弹出来的提示条 */
  #conflict {
    display: none; margin-top: 10px; padding: 10px 12px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid var(--accent); border-radius: 8px;
    font-size: 13px; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #conflict.show { display: flex; }
  #conflict span { flex: 1; min-width: 180px; }

  #drop {
    border: 1.5px dashed var(--border); border-radius: 8px;
    padding: 18px; text-align: center; color: var(--muted); font-size: 13px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }

  /* 上传进度 —— 传个几百兆的包，没这条进度页面看着像死了 */
  #progress { display: none; margin-top: 10px; font-size: 12px; color: var(--muted); }
  #progress.show { display: block; }
  #bar { margin-top: 6px; height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }

  /* 一行一条的收件流水。不做预览 —— 东西已经躺在下载目录里了，
     再把原图拉回来当缩略图纯属白花流量 */
  #grid { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  #grid:empty { display: none; }
  #grid li {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  }
  .ext {
    flex: none; width: 46px; padding: 4px 0; text-align: center; border-radius: 4px;
    font: 600 10px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .04em; color: var(--muted); background: var(--border);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* min-width:0 不能少，否则长文件名会把整行撑破而不是省略号 */
  .file-main { flex: 1; min-width: 0; }
  .file-main .name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-main .sub { margin-top: 2px; font-size: 11px; color: var(--muted); }
  #grid a.dl, #grid button.del {
    flex: none; padding: 3px 8px; font-size: 11px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    text-decoration: none; font-weight: 500;
  }
  @media (pointer: coarse) { #grid a.dl, #grid button.del { padding: 7px 10px; font-size: 12px; } }
  #grid button.del { color: var(--danger); }
  /* 本机那条路上「下载」会变成重复一份，所以换成一个点不动的标记 */
  #grid .saved { flex: none; padding: 3px 8px; font-size: 11px; color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(16px);
    max-width: calc(100vw - 32px);
    background: #1f2328; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { max-width: 820px; margin: 0 auto; padding: 0 16px 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>局域网剪贴板</h1>
  <div id="status"><span id="dot"></span><span id="statusText">连接中…</span></div>
</header>

<main>
  <section>
    <h2>文字 · 两端实时同步</h2>
    <textarea id="editor" placeholder="在这里输入或粘贴，另一台设备上会同步出现…" spellcheck="false"></textarea>
    <div id="conflict">
      <span id="conflictText"></span>
      <button id="takeRemote" class="ghost">用对方的</button>
    </div>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <button id="copy" class="primary">复制全部</button>
      <button id="tidy" class="ghost" title="把被硬换行切断的句子接回去">整理断行</button>
      <button id="clear" class="ghost">清空</button>
    </div>
  </section>

  <section>
    <h2 id="filesTitle">文件</h2>
    <div id="drop">点这里选文件</div>
    <div class="actions" id="pickers" hidden>
      <button id="pickImage" class="ghost">相册 / 拍摄</button>
    </div>
    <input id="file" type="file" multiple hidden>
    <input id="imageFile" type="file" accept="image/*,video/*" multiple hidden>
    <div id="progress"><span id="progressText"></span><div id="bar"><i id="barFill"></i></div></div>
    <ul id="grid"></ul>
  </section>
</main>

<footer id="hint"></footer>
<div id="toast"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const editor = $('editor'), metaEl = $('meta'), dot = $('dot'), statusText = $('statusText');
  const conflictBar = $('conflict'), grid = $('grid'), dropZone = $('drop');
  const fileInput = $('file'), imageInput = $('imageFile');
  const progressBox = $('progress'), progressText = $('progressText'), barFill = $('barFill');

  // crypto.randomUUID 只在安全上下文（https / localhost）里有，
  // 手机走 http://192.168.x.x 时拿不到，必须有退路
  const clientId = (() => {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'c-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  })();

  let state = { rev: -1, text: '', files: [], updatedBy: '', updatedAt: 0 };
  // 服务端会在每份快照里带上真实上限，这里只是它还没到之前的垫底值
  let limits = { maxFileBytes: 200 * 1024 * 1024, maxFiles: 20, maxTextChars: 200000 };
  let dirty = false;          // 本地有还没发出去的改动
  let pendingRemote = null;   // 你正在打字时收到的远端内容，先扣在这儿
  let pushTimer = null;
  let lastEventAt = 0;
  let es = null;

  // ─── 文案小工具 ───────────────────────────────────────────

  const ago = (ts) => {
    if (!ts) return '';
    const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
    if (s < 5) return '刚刚';
    if (s < 60) return s + ' 秒前';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    return Math.floor(s / 3600) + ' 小时前';
  };
  const kb = (n) => {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
    const mb = n / 1048576;
    return (Number.isInteger(mb) ? mb : mb.toFixed(1)) + ' MB';   // 200 MB 别写成 200.0 MB
  };

  const extOf = (name) => {
    const i = (name || '').lastIndexOf('.');
    const ext = i > 0 ? name.slice(i + 1) : '';
    return ext ? ext.slice(0, 6).toUpperCase() : '文件';
  };

  let toastTimer = null;
  function toast(msg, ms = 2000) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  }

  function setOnline(ok, label) {
    dot.className = ok ? 'online' : 'offline';
    statusText.textContent = label;
  }

  // ─── 渲染 ────────────────────────────────────────────────

  function renderMeta() {
    if (dirty) { metaEl.textContent = '正在输入…（停 0.4 秒自动同步）'; return; }
    const who = !state.updatedAt ? '' : (state.updatedBy === clientId ? '本机' : '另一台设备');
    const parts = [];
    if (who) parts.push(who + '更新 · ' + ago(state.updatedAt));
    parts.push(state.text.length + ' 字');
    metaEl.textContent = parts.join(' · ');
  }

  // 用 127.0.0.1 / localhost 打开的就是跑服务那台机器，它的收件箱已经收到文件了。
  // 手机走的是 192.168.x.x，到不了这里，所以手机上「下载」按钮照常显示。
  const onThisMachine = ['127.0.0.1', 'localhost', '::1', '[::1]'].includes(location.hostname);
  const savedHere = () => onThisMachine && !!(state.inbox || {}).enabled;

  function filesTitle() {
    const inbox = state.inbox || {};
    // 说「电脑的」是要紧的 —— 手机上看这句，很容易以为存到手机里了
    const where = inbox.enabled && inbox.name
      ? `自动存进电脑的 ${inbox.name}`
      : `最近 ${limits.maxFiles} 个`;
    return `文件 · ${where} · 单个上限 ${kb(limits.maxFileBytes)}`;
  }

  function renderFiles() {
    $('filesTitle').textContent = filesTitle();
    grid.innerHTML = '';
    for (const f of state.files) {
      const li = document.createElement('li');

      const ext = document.createElement('span');
      ext.className = 'ext';
      ext.textContent = extOf(f.name);

      const main = document.createElement('div');
      main.className = 'file-main';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = f.name;
      name.title = f.name;
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = `${kb(f.size)} · ${ago(f.at)}`;
      main.append(name, sub);

      // 在跑服务的这台机器上，文件早就落进收件箱了，再点「下载」只会多出一份
      // xxx (1).ext；别的设备（手机）没有收件箱，必须留着这个按钮才能取文件
      let action;
      if (savedHere()) {
        action = document.createElement('span');
        action.className = 'saved';
        action.textContent = '已存入';
        action.title = '已经在这台电脑的收件箱里了';
      } else {
        action = document.createElement('a');
        action.className = 'dl';
        action.href = '/api/files/' + f.id;
        action.download = f.name;
        action.textContent = '下载';
      }

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '删';
      del.onclick = () => removeFile(f.id);

      li.append(ext, main, action, del);
      grid.appendChild(li);
    }
  }

  let conflictTimer = null;

  function showConflict(msg) {
    $('conflictText').textContent = msg;
    conflictBar.classList.add('show');
    clearTimeout(conflictTimer);
    conflictTimer = setTimeout(hideConflict, 20000);  // 挂太久会碍事
  }

  function hideConflict() {
    clearTimeout(conflictTimer);
    conflictBar.classList.remove('show');
    pendingRemote = null;
  }

  function applyState(next) {
    next.files = next.files || [];
    if (next.limits) limits = next.limits;
    const textChanged = next.text !== state.text;
    const mine = next.updatedBy === clientId;

    // 你有没发出去的改动、而这条更新又不是你发的 —— 别抢你的光标，先扣下来问一句
    if (!mine && textChanged && dirty) {
      pendingRemote = next;
      showConflict('另一台设备刚改了内容。你继续发送会把它覆盖掉。');
      state = Object.assign({}, next, { text: state.text });  // 文件列表照常更新，文字留着你的
      renderFiles();
      return;
    }

    state = next;
    // 广播会把你自己发的内容原样回声给你，别让这一帧把后悔药收走
    if (!mine) hideConflict();
    if (editor.value !== next.text) {
      editor.value = next.text;
      dirty = false;
      forgetTidyBackup();   // 内容已经换人了，整理前那版留着也对不上
    }
    renderMeta();
    renderFiles();
  }

  // ─── 推送本地改动 ─────────────────────────────────────────

  async function push() {
    const text = editor.value;
    try {
      const res = await fetch('/api/text', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, clientId })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        toast(err.error || ('同步失败 ' + res.status), 3000);
        return;
      }
      dirty = false;
      state.text = text;
      renderMeta();
      // 别急着把提示条收掉 —— 你刚把对方那版覆盖了，留个后悔药
      if (pendingRemote) {
        showConflict('你发出去的内容已经覆盖掉另一台设备刚发的那版。');
      } else {
        hideConflict();
      }
    } catch (e) {
      toast('同步失败，检查一下网络', 3000);
    }
  }

  // ─── 整理断行 ────────────────────────────────────────────
  // 从 PDF、邮件、网页粘过来的文案，一句话常被硬生生切成好几行。
  // 这段负责把断掉的行接回去，同时绕开真正的分段、列表、标题和代码块。
  // 纯函数，不碰 DOM —— test_tidy.mjs 把 TIDY-START…TIDY-END 之间这段
  // 抠出去单测，这两个标记别删。
  /* TIDY-START */

  // 一行这样收尾才算话说完了，下一行是新起的，不该接上来。
  // 逗号、顿号故意不算 —— 句子被切断时，断点前最常见的就是它们。
  const SENTENCE_END = /[。．.！!？?…；;：:][”’"'」』）)\]】]*$/;

  // 列表、编号、标题、引用、表格、代码围栏 —— 这些开头天生自成一行
  const LEADS_LINE = /^\s*(?:[-*+•·○●▪]\s|\d+\s*[.)、]\s|[(（]\s*\d+\s*[)）]|[①-⑳]|#{1,6}\s|>|\||```|~~~)/;

  // 整行都不该被别的行接走的：标题、代码围栏、表格行
  const STANDS_ALONE = /^\s*(?:#{1,6}\s|```|~~~)|\|\s*$/;

  const CJK = /[\u2e80-\u303f\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\ufe30-\ufe4f\uff00-\uffef]/;

  // 这些点不是句号，是缩写：Dr. Inc. etc.，还有 e.g. / U.S. 这种连着好几个点的
  const ABBREV = /(?:\b(?:[Mm]r|[Mm]rs|[Mm]s|[Dd]r|[Pp]rof|[Ss]r|[Jj]r|[Ss]t|Inc|Ltd|Co|Corp|Dept|Fig|Vol|No|vs|etc|al|approx|est)\.|(?:[A-Za-z]\.){2,})$/;

  // PDF、邮件里常见的定宽排版 —— 每行都顶到同一个宽度才换。认出它来，
  // 才分得清行尾那个句号是真的分段，还是只是正好排到了行末。
  function wrapWidthOf(lines) {
    const lens = lines.filter((l) => l.trim()).map((l) => l.length);
    if (lens.length < 4) return 0;                 // 行太少，看不出规律，别猜
    const max = Math.max(...lens);
    if (max < 40) return 0;                        // 太窄，多半本来就是一行一句
    const full = lens.filter((n) => n >= max * 0.85).length;
    return full / lens.length >= 0.6 ? max : 0;    // 大半行都顶到头，才算定宽
  }

  // 定宽得一段一段地看：一篇里既有中文段、又有英文正文和列表时，
  // 整篇一起算会把那段 PDF 正文的定宽特征冲没。
  function wrapWidthPerLine(lines) {
    const width = new Array(lines.length).fill(0);
    let start = 0;
    const mark = (end) => {
      const w = wrapWidthOf(lines.slice(start, end));
      for (let i = start; i < end; i++) width[i] = w;
    };
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) { mark(i); start = i + 1; }   // 空行一到，这段就结了
    }
    mark(lines.length);
    return width;
  }

  // 这两行到底是「一句话被切开」，还是「本来就是两行」。
  // prevLen 是上一行被接之前的原长 —— 判定宽得看原样，不能看接完之后的。
  function shouldJoin(prev, next, wrapWidth, prevLen) {
    if (!prev.trim() || !next.trim()) return false;    // 空行是真的段落分隔
    if (LEADS_LINE.test(next)) return false;           // 下一行天生自成一行
    if (STANDS_ALONE.test(prev)) return false;         // 上一行不接受续行
    // 英文句子不会从小写字母起头 —— 这行准是上一行被切下来的后半截
    if (/^[a-z]/.test(next.trim())) return true;
    if (ABBREV.test(prev.trim())) return true;         // Dr. / etc. 不算说完
    if (SENTENCE_END.test(prev.trim())) {
      // 定宽排版里，满行的句号多半只是排到了行末，不是作者想分段
      return wrapWidth > 0 && prevLen >= wrapWidth * 0.85;
    }
    return true;
  }

  function joinTwo(prev, next) {
    const left = prev.replace(/[ \t]+$/, '');
    const right = next.replace(/^[\s\u3000]+/, '');
    if (!right) return left;
    // PDF 里英文单词被连字符拆到两行：inter- + national → international
    if (/[A-Za-z]-$/.test(left) && /^[a-z]/.test(right)) return left.slice(0, -1) + right;
    // 网址被切断，中间绝不能插空格，否则链接就废了
    if (/https?:\/\/\S*$/.test(left)) return left + right;
    const a = left.slice(-1), b = right.slice(0, 1);
    if (CJK.test(a) || CJK.test(b)) return left + right;   // 沾着中文就直接接
    return left + ' ' + right;                             // 西文之间留一个空格
  }

  function tidyText(src) {
    if (!src) return { text: src || '', merges: 0 };

    const lines = src
      .replace(/\r\n?/g, '\n')
      .replace(/[\u200b-\u200d\ufeff]/g, '')           // 粘贴常带的零宽字符
      .split('\n')
      .map((l) => l.replace(/[ \t\u3000]+$/, ''));     // 行尾空白

    const widths = wrapWidthPerLine(lines);
    const out = [];
    let merges = 0;
    let inFence = false;   // ``` 围栏里的换行是作者亲手写的，一行都不能动
    let prevLen = 0;       // 上一行没被接之前有多长

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^\s*(```|~~~)/.test(line)) inFence = !inFence;
      const prev = out.length ? out[out.length - 1] : null;
      if (!inFence && prev !== null && shouldJoin(prev, line, widths[i], prevLen)) {
        out[out.length - 1] = joinTwo(prev, line);
        merges++;
      } else {
        out.push(line);
      }
      prevLen = line.length;
    }

    // 连着好几个空行压成一个；首尾的空行直接扔掉
    const kept = out.filter((l, i) => l.trim() !== '' || (i > 0 && out[i - 1].trim() !== ''));
    while (kept.length && kept[0].trim() === '') kept.shift();
    while (kept.length && kept[kept.length - 1].trim() === '') kept.pop();

    return { text: kept.join('\n'), merges };
  }
  /* TIDY-END */

  let tidyBackup = null;   // 整理前那一版，留着给「撤销」

  function setTidyMode(canUndo) {
    $('tidy').textContent = canUndo ? '撤销整理' : '整理断行';
  }

  // 整理和撤销都要立刻同步到另一台设备，别等 400ms
  function commitNow() {
    dirty = true;
    renderMeta();
    clearTimeout(pushTimer);
    push();
  }

  function forgetTidyBackup() {
    if (tidyBackup === null) return;
    tidyBackup = null;
    setTidyMode(false);
  }

  $('tidy').onclick = () => {
    if (tidyBackup !== null) {
      editor.value = tidyBackup;
      forgetTidyBackup();
      commitNow();
      toast('已还原整理前的内容');
      return;
    }
    const src = editor.value;
    if (!src.trim()) { toast('还没有内容'); return; }
    const { text, merges } = tidyText(src);
    if (text === src) { toast('没找到要接回去的断行'); return; }
    tidyBackup = src;
    editor.value = text;
    setTidyMode(true);
    commitNow();
    toast(merges ? `接回 ${merges} 处断行 —— 不对就点「撤销整理」` : '已清掉多余空行和空格', 4000);
  };

  // 粘完只提示，不自己动手 —— 哪些换行是多余的，得你说了算
  editor.addEventListener('paste', () => {
    setTimeout(() => {
      if (tidyBackup !== null) return;
      const { merges } = tidyText(editor.value);
      if (merges >= 3) toast(`这段里有 ${merges} 处像是被切断的行 —— 点「整理断行」接回去`, 4000);
    }, 0);
  });

  editor.addEventListener('input', () => {
    forgetTidyBackup();   // 手一改，整理前那版就不再对得上了
    dirty = true;
    renderMeta();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 400);
  });

  // 离开输入框就立刻把改动落下去，别让它干等 400ms
  editor.addEventListener('blur', () => {
    if (dirty) { clearTimeout(pushTimer); push(); }
  });

  $('takeRemote').onclick = () => {
    if (!pendingRemote) return;
    editor.value = pendingRemote.text;
    hideConflict();
    // 光改本地显示不算数，得推回去，两端才真的一致
    dirty = true;
    clearTimeout(pushTimer);
    push();
  };

  $('clear').onclick = () => {
    editor.value = '';
    dirty = true;
    clearTimeout(pushTimer);
    push();
    toast('已清空');
  };

  // ─── 复制：三级回退 ───────────────────────────────────────
  // http://192.168.x.x 不是安全上下文，navigator.clipboard 在手机上直接没有，
  // 所以主力其实是第二级的 execCommand。

  $('copy').onclick = () => copyText(editor.value);

  async function copyText(text) {
    if (!text) { toast('还没有内容'); return; }

    if (window.isSecureContext && navigator.clipboard) {
      try { await navigator.clipboard.writeText(text); toast('已复制'); return; } catch (e) {}
    }

    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(ta);
    let ok = false;
    try {
      if (/ipad|iphone|ipod/i.test(navigator.userAgent)) {
        // iOS Safari 不认 textarea.select()，得自己建 Range
        const range = document.createRange();
        range.selectNodeContents(ta);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        ta.setSelectionRange(0, text.length);
      } else {
        ta.select();
        ta.setSelectionRange(0, text.length);
      }
      ok = document.execCommand('copy');
    } catch (e) {}
    document.body.removeChild(ta);
    if (ok) { toast('已复制'); return; }

    editor.focus();
    editor.select();
    toast('浏览器不让自动复制，已帮你全选 —— 长按选中处 → 拷贝', 5000);
  }

  // ─── 文件 ────────────────────────────────────────────────

  const pending = [];   // 等着传的，一个一个来，别同时挤满上行带宽
  let busy = false;

  function enqueue(files) {
    for (const f of files || []) {
      if (!f) continue;
      if (f.size <= 0) { toast(`${f.name || '这个文件'} 是空的，没传`, 3000); continue; }
      if (f.size > limits.maxFileBytes) {
        toast(`${f.name || '这个文件'} 太大了，单个上限 ${kb(limits.maxFileBytes)}`, 4000);
        continue;
      }
      pending.push(f);
    }
    pump();
  }

  async function pump() {
    if (busy) return;
    busy = true;
    let done = 0;
    while (pending.length) {
      const file = pending.shift();
      if (await upload(file)) done++;
    }
    busy = false;
    progressBox.classList.remove('show');
    if (done) toast(done === 1 ? '已送达' : `${done} 个文件已送达`);
    refresh();
  }

  // 用 XHR 不用 fetch —— fetch 没有上传进度事件，传大文件时页面看着像卡死了
  function upload(file) {
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/files?clientId=' + encodeURIComponent(clientId));
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      // 头里只能放 ASCII，中文名必须编码后再发，服务端会解回来
      xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name || '文件'));

      showProgress(file.name, 0);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) showProgress(file.name, e.loaded / e.total);
      };
      xhr.onload = () => {
        if (xhr.status === 200) { resolve(true); return; }
        let msg = '';
        try { msg = JSON.parse(xhr.responseText).error; } catch (e) {}
        toast(msg || ('上传失败 ' + xhr.status), 4000);
        resolve(false);
      };
      xhr.onerror = () => { toast('上传失败，检查一下网络', 3000); resolve(false); };
      xhr.onabort = () => resolve(false);
      xhr.send(file);
    });
  }

  function showProgress(name, ratio) {
    progressBox.classList.add('show');
    const pct = Math.round(ratio * 100);
    const queued = pending.length ? `（还有 ${pending.length} 个排队）` : '';
    progressText.textContent = `正在上传 ${name} · ${pct}%${queued}`;
    barFill.style.width = pct + '%';
  }

  async function removeFile(id) {
    await fetch('/api/files/' + id + '?clientId=' + encodeURIComponent(clientId), { method: 'DELETE' });
    refresh();
  }

  dropZone.onclick = () => fileInput.click();
  $('pickImage').onclick = () => imageInput.click();
  for (const input of [fileInput, imageInput]) {
    input.onchange = () => { enqueue(input.files); input.value = ''; };
  }

  ['dragenter', 'dragover'].forEach(ev =>
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('hot'); }));
  ['dragleave', 'drop'].forEach(ev =>
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('hot'); }));
  dropZone.addEventListener('drop', e => enqueue(e.dataTransfer.files));

  // 整页监听粘贴，截图直接 Ctrl+V 就走；从资源管理器复制的文件也认
  document.addEventListener('paste', e => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    const picked = [];
    for (const item of items) {
      if (item.kind !== 'file') continue;   // 粘贴纯文字时是 string，交给 textarea
      const f = item.getAsFile();
      if (f) picked.push(f);
    }
    if (picked.length) {
      e.preventDefault();
      enqueue(picked);
    }
  });

  // ─── 实时通道 ────────────────────────────────────────────

  function connect() {
    if (es) es.close();
    es = new EventSource('/api/events');
    es.onopen = () => setOnline(true, '已连接');
    es.onmessage = (e) => {
      lastEventAt = Date.now();
      setOnline(true, '已连接');
      try { applyState(JSON.parse(e.data)); } catch (err) {}
    };
    // EventSource 自己会重连，这里只负责把状态点标红
    es.onerror = () => setOnline(false, '断开了，正在重连…');
  }

  async function refresh() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      if (!res.ok) return;
      lastEventAt = Date.now();
      applyState(await res.json());
      setOnline(true, '已连接');
    } catch (e) {
      setOnline(false, '连不上服务端');
    }
  }

  // SSE 偶尔会被中间层缓冲住，连着 30 秒一声不吭就自己去拉一次
  setInterval(() => {
    if (Date.now() - lastEventAt > 30000) refresh();
    renderMeta();
  }, 10000);

  // 手机切回前台时 SSE 多半已经死了，补一刀
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { refresh(); connect(); }
  });

  // 触屏设备上没有拖拽也没有 Ctrl+V，别让它显示用不上的操作；
  // 但手机的文件选择器进相册要绕一层，所以单给一个直达按钮
  if (window.matchMedia('(pointer: coarse)').matches) {
    dropZone.textContent = '点这里选文件（文档、视频、压缩包都行）';
    $('pickers').hidden = false;
  } else {
    dropZone.textContent = '点这里选文件，或把文件拖进来 / 直接 Ctrl+V 粘贴截图';
  }

  $('hint').textContent = location.hostname === '127.0.0.1' || location.hostname === 'localhost'
    ? '手机连同一个 WiFi，打开启动时终端里打印的那个 192.168.x.x 地址即可。'
    : '没有口令，同一 WiFi 下谁都能看到这里的内容、下载这里的文件 —— 别贴密码。';

  refresh();
  connect();
})();
</script>
</body>
</html>
